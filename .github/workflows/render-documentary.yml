name: Render Documentary - Plotquake

on:
  workflow_dispatch:
    inputs:
      episode_path:
        description: Episode JSON
        type: string
        default: episodes/blackberry.json
        required: true
  push:
    branches: [main]
    paths: ['render-trigger/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: plotquake-documentary
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      render_key: ${{ steps.plan.outputs.render_key }}
    env:
      EPISODE_PATH: ${{ inputs.episode_path || 'episodes/blackberry.json' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          pip install -r worker/requirements.txt
          mkdir -p renders public/generated-audio

      - name: Create the documentary score and discreet sound accents
        run: python scripts/create_score.py

      - name: Restore previously completed narration scenes
        uses: actions/cache/restore@v4
        with:
          path: public/generated-audio
          key: plotquake-voice-v2-${{ hashFiles('episodes/*.json', 'worker/synthesize_narration.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            plotquake-voice-v2-${{ hashFiles('episodes/*.json', 'worker/synthesize_narration.py') }}-
            plotquake-voice-v2-

      - name: Narrate the episode with Charon and canonical baritone pitch
        run: python worker/synthesize_narration.py --episode "$EPISODE_PATH"

      - name: Save completed scenes for recovery
        if: always() && hashFiles('public/generated-audio/**/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: public/generated-audio
          key: plotquake-voice-v2-${{ hashFiles('episodes/*.json', 'worker/synthesize_narration.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the actual narration timeline and publication package
        run: |
          python worker/build_episode.py --episode "$EPISODE_PATH"
          python worker/build_youtube_package.py --episode "$EPISODE_PATH"

      - name: Plan as many balanced video chunks as the complete story needs
        id: plan
        run: python worker/render_documentary.py plan

      - name: Render one continuous audio master for the complete film
        run: python worker/render_documentary.py master-audio

      - name: Pass the exact timeline, audio and publication package to the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: prepared-episode
          overwrite: true
          retention-days: 1
          if-no-files-found: error
          path: |
            src/episodes/renderEpisode.json
            public/generated-audio/
            public/assets/audio/tension_score.wav
            public/assets/audio/chapter_transition.wav
            public/assets/audio/reveal_accent.wav
            renders/render_plan.json
            renders/master_audio.m4a
            renders/thumbnail.jpg
            renders/youtube_package.txt
            renders/youtube_package.json
            renders/visual_credits.txt

  render_chunks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout the same production commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install this worker's render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund
      - name: Download the prepared episode
        uses: actions/download-artifact@v4
        with:
          name: prepared-episode
      - name: Recover this worker's completed video chunks
        uses: actions/cache/restore@v4
        with:
          path: renders/chunks
          key: plotquake-video-v1-${{ needs.prepare.outputs.render_key }}-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            plotquake-video-v1-${{ needs.prepare.outputs.render_key }}-worker-${{ matrix.worker }}-
      - name: Render the assigned video chunks without splitting the master audio
        run: python worker/render_documentary.py render-worker --worker ${{ matrix.worker }}
      - name: Save completed chunks even if a later chunk failed
        if: always() && hashFiles('renders/chunks/chunk_*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: renders/chunks
          key: plotquake-video-v1-${{ needs.prepare.outputs.render_key }}-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve this worker's completed chunks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-${{ matrix.worker }}
          overwrite: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            renders/chunks/chunk_*.mp4
            renders/chunks/chunk_*.json

  assemble_and_deliver:
    needs: [prepare, render_chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EPISODE_PATH: ${{ inputs.episode_path || 'episodes/blackberry.json' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || vars.GOOGLE_DRIVE_FOLDER_ID || '1t_G2GMGgexWTT__2i0adglk1ZGjB_sw1' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout the same production commit
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install assembly and Drive dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r worker/requirements.txt
      - name: Restore the actual timeline, continuous audio, cover and metadata
        uses: actions/download-artifact@v4
        with:
          name: prepared-episode
      - name: Collect all completed video chunks
        uses: actions/download-artifact@v4
        with:
          pattern: video-worker-*
          path: renders/chunks
          merge-multiple: true
      - name: Join the complete video and copy its continuous audio master
        run: python worker/render_documentary.py assemble

      - name: Deliver the complete package to Google Drive
        run: |
          python worker/upload_outputs_to_drive.py \
            --episode "$EPISODE_PATH" \
            --video renders/documentary_final.mp4 \
            --thumbnail renders/thumbnail.jpg \
            --metadata renders/youtube_package.txt
          python - <<'PY'
          import json, os
          receipt = json.load(open('renders/drive_receipt.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Documentary delivered: [{receipt['title']}]({receipt['folderUrl']})\n\n")
              summary.write(f"Runtime: {receipt['video']['durationSeconds'] / 60:.2f} minutes; 1920×1080.\n")
          PY

      - name: Preserve the film, package and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-package-${{ github.run_id }}
          overwrite: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            renders/documentary_final.mp4
            renders/thumbnail.jpg
            renders/youtube_package.txt
            renders/youtube_package.json
            renders/visual_credits.txt
            renders/drive_receipt.json
            renders/render_plan.json
            src/episodes/renderEpisode.json
