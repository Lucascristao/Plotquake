<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="bg"><stop stop-color="#172334"/><stop offset="1" stop-color="#05070c"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="140" y="180" font-family="Arial" fill="#F6C383" font-size="22" letter-spacing="5">PLOTQUAKE • EDITORIAL TIMELINE</text><text x="140" y="275" font-family="Arial" fill="#fff" font-size="62" font-weight="700">The road to the presidency</text><text x="140" y="330" font-family="Arial" fill="#94A3B8" font-size="27">CHILE • 1970</text><path d="M345 560H1560" fill="none" stroke="#475569" stroke-width="4"/><g fill="#E5A158"><circle cx="345" cy="560" r="14"/><circle cx="960" cy="560" r="14"/><circle cx="1560" cy="560" r="14"/></g><g font-family="Arial" text-anchor="middle"><g fill="#F6C383" font-size="43" font-weight="700"><text x="345" y="485">SEPTEMBER 4</text><text x="960" y="485">OCTOBER 24</text><text x="1560" y="485">NOVEMBER 3</text></g><g fill="#fff" font-size="34" font-weight="700"><text x="345" y="650">POPULAR VOTE</text><text x="960" y="650">CONGRESS SELECTS</text><text x="1560" y="650">INAUGURATION</text></g><g fill="#CBD5E1" font-size="25"><text x="345" y="705">Allende wins a plurality</text><text x="960" y="705">Allende is confirmed</text><text x="1560" y="705">Allende takes office</text></g></g><text x="140" y="930" font-family="Arial" fill="#94A3B8" font-size="24">The political maneuvers between these dates were separate from the military coup of 1973.</text><text x="140" y="985" font-family="Arial" fill="#94A3B8" font-size="21">Sources: U.S. Senate investigations; contemporary government records in FRUS</text></svg>
